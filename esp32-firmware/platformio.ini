; ThermoCirculator - ESP32-S3 Firmware
; PlatformIO configuration
;
; Board:    ESP32-S3 DevKitC-1
; Framework: Arduino
; USB CDC:  Native USB (no external UART adapter needed)

[env:esp32-s3-devkitc-1]
platform  = espressif32 @ ^6.6.0
board     = esp32-s3-devkitc-1
framework = arduino

; ----------------------------------------------------------------------------------
; Build flags
; ----------------------------------------------------------------------------------
build_flags =
    ; Enable native USB CDC (replaces UART0)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; SPI / MAX31865
    -D MAX31865_CS_PIN=10
    -D MAX31865_MOSI_PIN=11
    -D MAX31865_MISO_PIN=13
    -D MAX31865_CLK_PIN=12
    ; SSR control GPIO
    -D SSR_PIN=4
    ; Safety: max allowed temperature (°C × 10 to avoid float)
    -D MAX_TEMP_LIMIT=150
    ; Watchdog: seconds without Android comms before auto-stop
    -D COMMS_TIMEOUT_SEC=10
    ; NFC PN532 – I²C pins
    -D NFC_SDA_PIN=8
    -D NFC_SCL_PIN=9
    -D NFC_IRQ_PIN=5
    -D NFC_RST_PIN=6

; ----------------------------------------------------------------------------------
; Upload / monitor
; ----------------------------------------------------------------------------------
upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

; ----------------------------------------------------------------------------------
; Library dependencies
; ----------------------------------------------------------------------------------
lib_deps =
    ; Adafruit MAX31865 driver (PT100 SPI)
    adafruit/Adafruit MAX31865 library @ ^1.6.0
    ; Adafruit BusIO (required by MAX31865 and PN532)
    adafruit/Adafruit BusIO @ ^1.14.3
    ; Adafruit PN532 NFC/RFID driver (I²C mode)
    adafruit/Adafruit PN532 @ ^1.2.7
